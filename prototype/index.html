<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SXF Discovery Engine</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="card">
      <p class="eyebrow">SXF Digital Framework</p>
        <div id="progressContainer" class="hidden">
        <div id="progressBar"></div>
        </div>
        <h1 id="screenTitle">SXF Discovery Engine</h1>

        <p id="screenDescription" class="description">
        Let’s understand your business before building your website.
        </p>

      <div id="questionArea" class="hidden">
        <label id="questionLabel" for="answerInput">
        What is the name of your business?
        </label>

        <input
        id="answerInput"
        type="text"
        placeholder="Example: SXF Digital"
        />
      </div>

      <button id="startButton">Start Discovery</button>
      <button id="nextButton" class="hidden">Next</button>
      <button id="restartButton" class="hidden">Restart Discovery</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
